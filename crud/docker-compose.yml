services:
  mysql:
    image: mysql:8.4
    container_name: salao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: salao
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - salao-mysql-data:/var/lib/mysql

volumes:
  salao-mysql-data:
